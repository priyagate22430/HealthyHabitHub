<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | HealthyHabitHub</title>
<link rel="stylesheet" href="../css/signup.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<header class="navbar">
    <div class="logo">HealthyHabitHub</div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="recipe.html">Recipes</a></li>
        <li><a href="bmi.html">BMI</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="btn-nav">Contact</a></li>
    </ul>
</header>

<!-- Hero Section -->
<section class="hero">
    <div class="overlay"></div>
    <div class="hero-content">
        <h1>Create Your Account</h1>
        <p>Join HealthyHabitHub and start your healthy journey 🌿</p>
    </div>
</section>

<!-- Signup Form Section -->
<section class="signup-section">
    <div class="signup-container">
        <h2>Sign Up</h2>
     <form id="signupForm">

        <label for="name">Full Name</label>
        <input type="text" id="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="age">Age</label>
        <input type="number" id="age" min="1" max="120" required>

        <label for="gender">Gender</label>
        <select id="gender" required>
           <option value="">Select Gender</option>
           <option value="Female">Female</option>
           <option value="Male">Male</option>
           <option value="Other">Other</option>
        </select>

        <label for="password">Password</label>
        <input type="password" id="password" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" required>

        <button type="submit" class="btn">Sign Up</button>

     </form>
        <p>Already have an account? <a href="login.html">Login</a></p>
        <p id="signupMsg" style="color:green; display:none; margin-top:10px;">Signup successful!</p>
    </div>
</section>

<script src="../js/signup.js"></script>
</body>
</html>

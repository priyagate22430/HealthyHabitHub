<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | HealthyHabitHub</title>
<link rel="stylesheet" href="../css/login.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<header class="navbar">
    <div class="logo">HealthyHabitHub</div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="recipe.html">Recipes</a></li>
        <li><a href="bmi.html">BMI</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="btn-nav">Contact</a></li>
    </ul>
</header>

<!-- Hero Section -->
<section class="hero">
    <div class="overlay"></div>
    <div class="hero-content">
        <h1>Welcome Back</h1>
        <p>Login to continue your healthy journey 🌿</p>
    </div>
</section>

<!-- Login Form Section -->
<section class="login-section">
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <button type="submit" class="btn">Login</button>
        </form>
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
       <p id="loginMsg" style="display:none; margin-top:10px;"></p>
    </div>
</section>

<script src="../js/login.js"></script>
</body>
</html>
